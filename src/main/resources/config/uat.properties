# Confirmed real for QA - the same host used by login and contact-us (both
# verified via real curls in this repo's history). api.version defaults to
# "v0", also confirmed shared across those same endpoints.
# NOTE: this key was previously named "api.base.url" only, which left
# ConfigManager.getBaseUrl() (reads "base.url", per every other env file)
# unresolvable for qa - the default profile - breaking every test class,
# portfolio planner or not. Restored to match dev/stage/prod.
base.url=https://uatappapi.valueresearchonline.com
# Second host confirmed real via a live authenticated curl: the User
# Portfolio API (label-opinion-data) is served from the advisor app API
# gateway, not the main app API host above. See ConfigManager.getAdvisorApiBaseUrl().
advisor.api.base.url=https://uatadvappapi.valueresearchonline.com

# Portfolio Planner API endpoints (all confirmed real via live curls in
# docs/test-plans/portfolio-planner-apis.md). Paths only - host comes from
# base.url/advisor.api.base.url above.
planner.endpoint=/api/v1/planner/funds-buy/generate
portfolio.label.opinion.endpoint=/api/v1/user-portfolio/label-opinion-data
fund.opinion.endpoint=/api/v1/funds/fund-opinion-data/get-list
fund.details.endpoint=/api/v1/funds
fund.plan.options.endpoint=/api/v1/funds/fund-plan-options-masters/get-list
fund.filter.endpoint=/api/v1/funds/filter
gql.component.endpoint=/api/v1/gql/component
config.master.endpoint=/api/v1/conf/config-masters/get

api.version=v0
connect.timeout.ms=5000
# Bumped from 10000: Planner Generate (funds-buy/generate, since the
# 2026-09-08 host/path change) does real fund-selection computation -
# confirmed ~22s on an isolated live call, but slower still (and sometimes a
# 500) under this suite's default parallel execution (parallel="classes"
# thread-count=5 - several Planner Generate calls firing concurrently).
# 45s gives real margin over the ~22s isolated figure. Every other Portfolio
# Planner API responds in under 1.5s, so this only costs a longer wait on a
# genuine server error for them, not a new failure mode. If Planner Generate
# tests still time out intermittently under full-suite parallel runs, that's
# a backend capacity/concurrency finding to raise with the API owner, not
# something a client-side timeout value alone can fully paper over.
read.timeout.ms=45000

auth.type=vrlogin
auth.token.url=https://qa.api.example.com/auth/token
auth.username=CHANGE_ME
auth.password=CHANGE_ME

# Used only when auth.type=bearer and the token is a statically issued value
# (no fetch needed) - e.g. supplied via -Dauth.bearer.token=... in CI.
auth.bearer.token=CHANGE_ME

# Used only when auth.type=apikey
auth.apikey.header.name=X-API-Key
auth.apikey.value=CHANGE_ME

# Used only when auth.type=oauth2 (client_credentials grant against auth.token.url)
auth.oauth2.client.id=CHANGE_ME
auth.oauth2.client.secret=CHANGE_ME
auth.oauth2.scope=
auth.oauth2.grant.type=client_credentials

# Used only when auth.type=vrlogin - dynamic login-based authentication.
# username/password are real secrets: never hardcode them, override via
# -Dauth.vrlogin.username=... -Dauth.vrlogin.password=... from a CI secret
# store. Host + path confirmed real for QA (the API gateway, not the plain
# qa.valueresearch.in used in an earlier, less precise curl example).
auth.vrlogin.base.url=https://uatappapi.valueresearchonline.com
auth.vrlogin.username=wamiqasif+spqa@valueresearch.in
auth.vrlogin.password=Wamiq@123
auth.vrlogin.provider=VROL
auth.vrlogin.site.code=VROL
auth.vrlogin.order.id=
auth.vrlogin.form.token=
auth.vrlogin.target=/
auth.vrlogin.url.hash=
# "Name:Value||Name2:Value2" (|| separator - see LoginService.parseExtraHeaders
# for why not a single ";", which a User-Agent value would corrupt).
# json-api-key is confirmed required and real for QA - it identifies the
# calling application (like a publishable client key), not a user secret,
# so it's committed here rather than CHANGE_ME'd like username/password.
# origin/referer/user-agent are included defensively (some WAFs reject
# requests that don't look like they came from a real browser) - adjust or
# remove if the real environment doesn't need them.
auth.vrlogin.headers=json-api-key:sw3ihjv52q2awoyw2q3x84vhkhyvepxq||app-platform:web||origin:https://advisoruat2.valueresearchonline.com||referer:https://advisoruat2.valueresearchonline.com/||user-agent:Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36
# Confirmed real for QA - the same key the frontend passes to
# `new JSEncrypt().setPublicKey(...)`. Public (not a secret) by design, so
# committed here like json-api-key rather than CHANGE_ME'd. Base64 DER
# (X.509 SubjectPublicKeyInfo) - a PEM PUBLIC KEY block with the
# header/footer/line breaks stripped. See auth.EncryptionService.
auth.vrlogin.rsa.public.
# Confirmed real for QA (a real authenticated call's response) - see
# AuthenticationManager for how "status" (business-level success, distinct
# from the HTTP status code) and session-alerts (failure reason) are used.
auth.vrlogin.token.jsonpath=token
auth.vrlogin.token.cookie.name=
auth.vrlogin.token.expiry.seconds=1500

retry.max.attempts=2
retry.delay.ms=500

