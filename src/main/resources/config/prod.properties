# ---------------------------------------------------------------------------
# PROD environment configuration
# Loaded by config.ConfigManager when env=prod (-Pprod)
#
# Credentials below are intentionally left blank. In CI, override them with
# -Dauth.username=... -Dauth.password=... (or environment variables wired
# through EnvironmentResolver) sourced from the pipeline's secret store.
# Never commit real production credentials to this file.
# ---------------------------------------------------------------------------

# Follows the confirmed-real QA host pattern with the env prefix dropped -
# not itself confirmed; verify before relying on it.
base.url=https://appapi.valueresearch.in
api.version=v0
connect.timeout.ms=5000
read.timeout.ms=10000

auth.type=vrlogin
auth.token.url=https://api.example.com/auth/token
auth.username=
auth.password=

# All auth-mechanism secrets below are intentionally blank - override via
# -D system properties from the CI secret store, never commit real values.
auth.bearer.token=
auth.apikey.header.name=X-API-Key
auth.apikey.value=
auth.oauth2.client.id=
auth.oauth2.client.secret=
auth.oauth2.scope=
auth.oauth2.grant.type=client_credentials

# Used only when auth.type=vrlogin - dynamic login-based authentication.
# Host follows the confirmed-real QA pattern with the env prefix dropped -
# NOT itself confirmed; verify before relying on it.
auth.vrlogin.base.url=https://appapi.valueresearch.in
auth.vrlogin.username=
auth.vrlogin.password=
auth.vrlogin.provider=VROL
auth.vrlogin.site.code=VROL
auth.vrlogin.order.id=
auth.vrlogin.form.token=
auth.vrlogin.target=/
auth.vrlogin.url.hash=
# "Name:Value||Name2:Value2" (|| separator - see LoginService.parseExtraHeaders).
auth.vrlogin.headers=json-api-key:||app-platform:web||origin:https://advisor.valueresearch.in||referer:https://advisor.valueresearch.in/||user-agent:Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36
auth.vrlogin.rsa.public.key=
auth.vrlogin.token.jsonpath=token
auth.vrlogin.token.cookie.name=
auth.vrlogin.token.expiry.seconds=1500

retry.max.attempts=1
retry.delay.ms=500
