# ---------------------------------------------------------------------------
# STAGE environment configuration
# Loaded by config.ConfigManager when env=stage (-Pstage)
# ---------------------------------------------------------------------------

# Follows the confirmed-real QA host pattern (<env>appapi.valueresearch.in) -
# not itself confirmed; verify before relying on it.
base.url=https://stageappapi.valueresearch.in
api.version=v0
connect.timeout.ms=5000
read.timeout.ms=10000

auth.type=vrlogin
auth.token.url=https://stage.api.example.com/auth/token
auth.username=CHANGE_ME
auth.password=CHANGE_ME

# Used only when auth.type=bearer and the token is a statically issued value
# (no fetch needed) - e.g. supplied via -Dauth.bearer.token=... in CI.
auth.bearer.token=CHANGE_ME

# Used only when auth.type=apikey
auth.apikey.header.name=X-API-Key
auth.apikey.value=CHANGE_ME

# Used only when auth.type=oauth2 (client_credentials grant against auth.token.url)
auth.oauth2.client.id=CHANGE_ME
auth.oauth2.client.secret=CHANGE_ME
auth.oauth2.scope=
auth.oauth2.grant.type=client_credentials

# Used only when auth.type=vrlogin - dynamic login-based authentication.
# username/password are real secrets: never hardcode them, override via
# -Dauth.vrlogin.username=... -Dauth.vrlogin.password=... from a CI secret
# store. Host follows the confirmed-real QA pattern (<env>appapi.valueresearch.in)
# but is NOT itself confirmed - verify before relying on it.
auth.vrlogin.base.url=https://stageappapi.valueresearch.in
auth.vrlogin.username=CHANGE_ME
auth.vrlogin.password=CHANGE_ME
auth.vrlogin.provider=VROL
auth.vrlogin.site.code=VROL
auth.vrlogin.order.id=
auth.vrlogin.form.token=
auth.vrlogin.target=/
auth.vrlogin.url.hash=
# "Name:Value||Name2:Value2" (|| separator - see LoginService.parseExtraHeaders).
# json-api-key is almost certainly per-environment - CHANGE_ME'd here, not
# copied from QA's real key. origin/referer follow QA's confirmed pattern.
auth.vrlogin.headers=json-api-key:CHANGE_ME||app-platform:web||origin:https://advisorstage.valueresearch.in||referer:https://advisorstage.valueresearch.in/||user-agent:Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36
# RSA public key almost certainly per-environment too - CHANGE_ME'd here,
# not copied from QA's confirmed key. See auth.EncryptionService.
auth.vrlogin.rsa.public.key=CHANGE_ME
auth.vrlogin.token.jsonpath=token
auth.vrlogin.token.cookie.name=
auth.vrlogin.token.expiry.seconds=1500

retry.max.attempts=2
retry.delay.ms=500
